<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bob · Camino de progreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --speaking:#3660AB; --speaking-2:#7aa0ff; --speaking-d:#26417a;
    --reading:#1FA86B;  --reading-2:#5fe0a3;  --reading-d:#157a4d;
    --listening:#F8920A;--listening-2:#ffc25e;--listening-d:#c46c00;
    --writing:#E8392F;  --writing-2:#ff847c;  --writing-d:#b32219;
    --gold:#ffc73a; --gold-d:#d99300; --ink:#2c2348; --muted:#9a93b4;
    --grey:#e3ddef; --grey-2:#f6f2fd; --grey-d:#cdc4e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg,#f3eeff 0%, #fdf6ef 100%);
  }
  .app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px;
    background:radial-gradient(700px 380px at 50% -6%, #e9e0ff 0%, transparent 60%), #fbf8ff;
    box-shadow:0 0 0 1px rgba(124,92,255,.06), 0 30px 80px -40px rgba(60,40,110,.5)}

  /* top bar (sticky) */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:20px;
    height:54px;background:rgba(251,248,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(124,92,255,.08);font-family:'Baloo 2';font-weight:800;font-size:15px}
  .topbar span{display:inline-flex;align-items:center;gap:6px}
  .topbar svg{width:18px;height:18px}

  /* unit (one skill) */
  .unit{padding:0 0 26px}
  .unit-head{position:sticky;top:54px;z-index:30;margin:0 14px 8px;padding:11px 14px;border-radius:18px;
    display:flex;align-items:center;gap:12px;color:#fff;
    background:linear-gradient(120deg,var(--c2),var(--c));box-shadow:0 10px 22px -10px var(--c),0 2px 0 rgba(255,255,255,.35) inset}
  .unit-head .uh-ic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.22)}
  .unit-head .uh-ic svg{width:24px;height:24px;color:#fff}
  .unit-head .uh-mid{flex:1;min-width:0}
  .unit-head .uh-name{font-family:'Baloo 2';font-weight:800;font-size:17px;line-height:1.05}
  .unit-head .uh-sub{font-weight:800;font-size:11.5px;opacity:.92;margin-top:1px}
  .unit-head .uh-cnt{font-family:'Baloo 2';font-weight:800;font-size:13px;background:rgba(0,0,0,.16);
    padding:3px 10px;border-radius:99px;flex:none}
  .unit-head .uh-bar{position:absolute;left:14px;right:14px;bottom:6px;height:4px;border-radius:99px;background:rgba(255,255,255,.3)}
  .unit-head .uh-bar i{display:block;height:100%;border-radius:99px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}

  .unit.l{--c:var(--listening);--c2:var(--listening-2);--cd:var(--listening-d)}
  .unit.s{--c:var(--speaking);--c2:var(--speaking-2);--cd:var(--speaking-d)}
  .unit.r{--c:var(--reading);--c2:var(--reading-2);--cd:var(--reading-d)}
  .unit.w{--c:var(--writing);--c2:var(--writing-2);--cd:var(--writing-d)}

  .trail{position:relative;margin-top:6px}

  /* ---- 3D node (Duolingo button) ---- */
  .node{position:absolute;left:50%;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:radial-gradient(120% 120% at 50% 24%, var(--grey-2), var(--grey) 72%);
    box-shadow:0 7px 0 var(--grey-d),0 13px 16px -7px rgba(60,40,110,.4),0 2px 1px #fff inset}
  .node svg{width:29px;height:29px;display:block}
  .node.done{background:radial-gradient(120% 120% at 50% 24%, var(--c2), var(--c) 78%);
    box-shadow:0 7px 0 var(--cd),0 14px 18px -7px var(--c),0 2px 1px rgba(255,255,255,.55) inset}
  .node.locked svg{opacity:.5}
  .node.current{z-index:6;
    background:radial-gradient(120% 120% at 50% 24%, var(--c2), var(--c) 78%);
    box-shadow:0 7px 0 var(--cd),0 16px 22px -6px var(--c),0 2px 1px rgba(255,255,255,.55) inset}
  .node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);
    opacity:.55;animation:ring 1.8s ease-out infinite}
  @keyframes ring{0%{transform:scale(.72);opacity:.6}100%{transform:scale(1.32);opacity:0}}
  .node.current .start{position:absolute;top:-30px;font-family:'Baloo 2';font-weight:800;font-size:12px;color:var(--c);
    background:#fff;padding:2px 11px;border-radius:99px;box-shadow:0 4px 10px -3px rgba(0,0,0,.25);white-space:nowrap}
  .node.current .start::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#fff}
  .node.current svg{animation:beat 1.5s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16) rotate(7deg)}}

  /* goal node — target level for this skill */
  .node.goal{width:78px;height:78px;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:1px;
    background:radial-gradient(120% 120% at 50% 24%, var(--grey-2), var(--grey) 75%);
    box-shadow:0 7px 0 var(--grey-d),0 14px 18px -7px rgba(60,40,110,.4)}
  .node.goal svg{width:28px;height:28px;opacity:.5;color:#8d85a8}
  .node.goal .lvl{font-family:'Baloo 2';font-weight:800;font-size:15px;line-height:1;color:#8d85a8}
  .node.goal.reached{background:radial-gradient(120% 120% at 50% 24%, #ffe79c, var(--gold) 80%);
    box-shadow:0 7px 0 var(--gold-d),0 16px 22px -7px var(--gold),0 2px 1px rgba(255,255,255,.6) inset}
  .node.goal.reached svg{opacity:1;color:#fff}
  .node.goal.reached .lvl{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18)}
  .node.goal.reached::before{content:"";position:absolute;inset:-14px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(255,199,58,.5),transparent 66%);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}

  .node,.goal{animation:pop .45s cubic-bezier(.2,.9,.3,1.4) backwards}
  @keyframes pop{from{opacity:0;transform:translate(var(--tx,-50%),-50%) scale(.4)}}

  .foot{text-align:center;color:var(--muted);font-size:11px;font-weight:800;padding:6px 20px 30px}

  /* bottom tab bar (one tab per skill) */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:50;
    width:100%;max-width:460px;display:flex;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(124,92,255,.1);
    box-shadow:0 -8px 24px -12px rgba(60,40,110,.4)}
  .nav .tab{flex:1;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;border-radius:15px;background:transparent;color:var(--c);font-family:'Nunito',sans-serif;
    transition:transform .15s, background .15s}
  .nav .tab svg{width:25px;height:25px}
  .nav .tab .tn{font-weight:800;font-size:10px;opacity:.7}
  .nav .tab:not(.active):hover{background:rgba(124,92,255,.06)}
  .nav .tab.active{color:#fff;background:linear-gradient(150deg,var(--c2),var(--c));
    box-shadow:0 8px 16px -6px var(--c);transform:translateY(-2px)}
  .nav .tab.active .tn{opacity:1}
  .nav .tab.l{--c:var(--listening);--c2:var(--listening-2)}
  .nav .tab.s{--c:var(--speaking);--c2:var(--speaking-2)}
  .nav .tab.r{--c:var(--reading);--c2:var(--reading-2)}
  .nav .tab.w{--c:var(--writing);--c2:var(--writing-2)}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span><svg viewBox="0 0 24 24" fill="#ff7a1a"><path d="M13 2C9 6 7 9 7 13a5 5 0 0 0 10 0c0-2-1-3-1-3 0 2-1 3-2 3 1-4-1-8-1-11z"/></svg>12</span>
    <span><svg viewBox="0 0 24 24" fill="#33c4ff"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>500</span>
    <span><svg viewBox="0 0 24 24" fill="#ffc73a"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>38</span>
    <span><svg viewBox="0 0 24 24" fill="#ff4d6d"><path d="M12 21C5 15 2 11 2 7.5A4.5 4.5 0 0 1 12 5a4.5 4.5 0 0 1 10 2.5C22 11 19 15 12 21z"/></svg>5</span>
  </div>

  <div id="track"></div>

  <div class="foot">Prototipo · datos de ejemplo · cada habilidad tiene su propio camino hasta su meta</div>

  <nav class="nav" id="nav"></nav>
</div>

<script>
  const ICON={
    headphones:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><path d="M3.5 15a2 2 0 0 1 2-2H7v6H5.5a2 2 0 0 1-2-2z" fill="currentColor" stroke="none"/><path d="M20.5 15a2 2 0 0 0-2-2H17v6h1.5a2 2 0 0 0 2-2z" fill="currentColor" stroke="none"/></svg>',
    mic:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>',
    book:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.2C9.8 3.6 6.2 3.4 3.6 4.4v13.2c2.6-1 6.2-.8 8.4.8 2.2-1.6 5.8-1.8 8.4-.8V4.4C17.8 3.4 14.2 3.6 12 5.2z"/><path d="M12 5.6v13" stroke="#fff" stroke-width="1.1" opacity=".55"/></svg>',
    pencil:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 3.5l5.5 5.5L9 20.5l-5.5 1.4L4.9 16z"/><path d="M13.4 5.1l5.5 5.5" stroke="#fff" stroke-width="1.1" opacity=".5"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.3L19 6.5"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>',
    lock:'<svg viewBox="0 0 24 24" fill="#8d85a8"><rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="#8d85a8" stroke-width="2.4"/></svg>',
    trophy:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5.5H4.5v1A3 3 0 0 0 7.5 9.5M17 5.5h2.5v1a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 12.5h3v3h-3z"/><rect x="7" y="18.5" width="10" height="2.6" rx="1.3"/></svg>'
  };

  const GAP=94, AMP=82, FREQ=0.74;
  const offAt=i=>Math.sin(i*FREQ)*AMP;

  function makeNode(html,cls,i,extraTop){
    const n=document.createElement('div');n.className='node '+cls;
    const off=offAt(i);
    n.style.top=(i*GAP+(extraTop||0))+'px';
    n.style.setProperty('--tx',`calc(-50% + ${off}px)`);
    n.style.transform=`translate(calc(-50% + ${off}px), -50%)`;
    n.style.animationDelay=(0.2+i*0.03)+'s';
    n.innerHTML=html;
    return n;
  }

  function buildUnit(skill){
    const {letter,name,icon,sub,total,done,level}=skill;
    const unit=document.createElement('div');unit.className='unit '+letter;
    const pct=Math.round(done/total*100);
    unit.innerHTML=
      `<div class="unit-head">
         <div class="uh-ic">${ICON[icon]}</div>
         <div class="uh-mid"><div class="uh-name">${name}</div><div class="uh-sub">${sub}</div></div>
         <div class="uh-cnt">${done}/${total}</div>
         <div class="uh-bar"><i style="width:${pct}%"></i></div>
       </div>`;
    const trail=document.createElement('div');trail.className='trail';

    for(let i=0;i<total;i++){
      let n;
      if(i<done) n=makeNode(ICON.check,'done',i);
      else if(i===done) n=makeNode(ICON.star+'<div class="start">EMPEZAR</div>','current',i);
      else n=makeNode(ICON.lock,'locked',i);
      trail.appendChild(n);
    }

    const reached=done>=total;
    const g=makeNode(`${ICON.trophy}<span class="lvl">${level}</span>`,'goal'+(reached?' reached':''),total);
    trail.appendChild(g);

    trail.style.height=((total)*GAP+96)+'px';
    unit.appendChild(trail);
    return unit;
  }

  const SKILLS=[
    {letter:'l',name:'Listening',icon:'headphones',sub:'Nivel A2 ▸ B1',total:30,done:12,level:'B1'},
    {letter:'s',name:'Speaking', icon:'mic',       sub:'Nivel A2 ▸ B1',total:30,done:7, level:'B1'},
    {letter:'r',name:'Reading',  icon:'book',      sub:'¡Nivel B1 alcanzado!',total:30,done:30,level:'B1'},
    {letter:'w',name:'Writing',  icon:'pencil',    sub:'Nivel B1 ▸ B2',total:30,done:3, level:'B2'},
  ];
  const track=document.getElementById('track');
  const nav=document.getElementById('nav');

  function render(idx){
    track.innerHTML='';
    track.appendChild(buildUnit(SKILLS[idx]));
    [...nav.children].forEach((t,i)=>t.classList.toggle('active',i===idx));
    window.scrollTo({top:0});
  }

  SKILLS.forEach((s,i)=>{
    const t=document.createElement('button');
    t.className='tab '+s.letter;
    t.innerHTML=ICON[s.icon]+`<span class="tn">${s.name}</span>`;
    t.onclick=()=>render(i);
    nav.appendChild(t);
  });

  render(0);
</script>
</body>
</html>
